# Production web deploy. Railway deploys api, worker and centrifugo from `main`
# on its own; this ships the web app to Vercel. Production's variables
# (API_ORIGIN_INTERNAL and the VITE_* URLs) live in the Vercel project's
# Production environment, and `vercel pull` brings them into the build.
#
# Repository variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID · secret: VERCEL_TOKEN
name: Deploy web

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_CLI: vercel@54.4.1
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel() { npx -y "$VERCEL_CLI" "$@" --token "$VERCEL_TOKEN"; }
          vercel pull --yes --environment=production
          vercel build --prod
          vercel deploy --prebuilt --prod

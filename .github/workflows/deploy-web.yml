# Production web deploy. The api runs in one of two places, chosen by one variable in the Vercel project's
# Production environment, API_ORIGIN_INTERNAL:
#   set    the middleware proxies /api to that API (Render, or Railway once it is healthy), which deploys itself
#          from `main`; this waits until it runs this commit, then ships the web app.
#   unset  the api runs as a Vercel Function in this same deployment (spec 0045), so it ships with the web app at
#          once. This applies the migrations first (DATABASE_URL_OWNER, a repository secret), never two at a time
#          (the workflow's concurrency group), and refuses to deploy when they fail.
# Production's variables (the api's server ones too, in function mode) live in the Vercel project's Production
# environment, and `vercel pull` brings them into the build. Monitoring (spec 0010): VITE_SENTRY_DSN_WEB lives there
# too, and the build uploads its hidden source maps to Sentry only when SENTRY_AUTH_TOKEN is set here; without it
# the step says so and deploys the same build, maps deleted either way. The release is the commit CI passed (set as
# GITHUB_SHA for the build). Before the deploy, a check refuses a build whose client files hold any server secret's
# value (apps/web/client-secrets.ts).
#
# Two productions deploy from the same commit, one job each (the matrix below): brij-crm on the personal Vercel,
# and Timefix (app.timefix.com, project timefix-app on the Timefix Vercel team, its own Neon database). A target
# whose token is unset is skipped with a notice.
# Repository variables: VERCEL_ORG_ID, VERCEL_PROJECT_ID, TIMEFIX_VERCEL_ORG_ID, TIMEFIX_VERCEL_PROJECT_ID,
# SENTRY_ORG, SENTRY_PROJECT_WEB
# Secrets: VERCEL_TOKEN and TIMEFIX_VERCEL_TOKEN, DATABASE_URL_OWNER and TIMEFIX_DATABASE_URL_OWNER (function mode
# only), SENTRY_AUTH_TOKEN (optional: an organization token that can only upload releases)
#
# Order (8 October 2026): the web app ships only after CI passes on main, and, behind a proxied API, only once that
# API runs this commit, when the commit changed the API at all. A new web app calling procedures the old API lacks
# broke the People page for a deploy's length before. /api/health names the API's commit.
#
# Fast path (22 October 2026, the owner's call): a push to main whose commit already passed every required CI job on
# another branch (a landing branch fast forwarded onto main is the same commit) deploys at once, without waiting for
# main's own CI run. Otherwise main's CI run triggers the deploy as before, and a commit the fast path deployed isn't
# deployed twice.
name: Deploy web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # The push path waits up to fifteen minutes for the jobs it needs, so the job itself must outlast that wait.
    # At five it was killed mid wait and the deploy read as cancelled (26 October 2026).
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decide whether this commit deploys now
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # These must be green on the commit. Nothing else may stand in for them.
          #
          # The flows were here too, and a deploy took about twenty minutes (the owner, 26 October 2026). They are
          # the slowest job by far, and four runs in one evening died installing a browser without ever reaching a
          # test, so a flaky apt mirror stood between a fix and production. They still run on every push; they
          # just no longer hold the deploy. `check` and `ui` run side by side and settle in about four minutes,
          # which is what shipping a change costs now.
          #
          # What that trades: a flow failure is found after the deploy rather than before, and the answer is
          # `vercel rollback`, which takes seconds. That is the right trade while the product has no customers to
          # protect. Put the flows back the moment it has them.
          REQUIRED=("check" "ui")
          # These run only when the change touched packages/ui (`needs.changes` in ci.yml), so on any other change
          # they are skipped rather than green. Reading skipped as "not passed" meant the fast path declined every
          # time the library was untouched, which is most changes, so the path never once fired (26 October 2026).
          # They are read apart rather than by loosening the rule for all nine: a flow shard skipped because an
          # earlier job failed must never read as a pass.
          #
          # A skipped matrix job reports one check run, under the name as written in ci.yml with the browser still
          # unexpanded, and never the three browsers. Waiting for the three was waiting for names that would never
          # arrive, so the path still declined every time, fifteen minutes later (27 October 2026). `settled_ui`
          # below reads either shape: all three browsers, or the one skipped matrix. The name is matched by its
          # shape rather than written out, so Actions doesn't read it as an expression of this job's own.
          settled_ui() {
            grep -Fxq "visual" <<< "$1" || return 1
            grep -Fxq "stories (chromium)" <<< "$1" \
              && grep -Fxq "stories (firefox)" <<< "$1" \
              && grep -Fxq "stories (webkit)" <<< "$1" && return 0
            grep -qE '^stories \(.*matrix\.browser' <<< "$1"
          }
          if [ "$EVENT" = push ]; then
            sha="$PUSH_SHA"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            # This run starts with the push, before a single job has finished, so it waits for the ones it needs
            # rather than reading once and declining (the owner, 26 October 2026). Reading once meant the only
            # thing that could ever trigger a deploy was CI finishing in full, flows and all, which is the twenty
            # minutes this change exists to remove. It gives up after fifteen, which is longer than every job it
            # waits on has ever taken; CI finishing is then the second route, as before.
            deadline=$((SECONDS + 900))
            while true; do
              runs=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" \
                -q '.check_runs[] | "\(.conclusion)\t\(.name)"' || true)
              # `|| true`: no line of a kind is an empty list, not a failure, and `set -e` would end the job.
              passed=$(grep -E '^success\s' <<< "$runs" | cut -f2- | sort -u || true)
              settled=$(grep -E '^(success|skipped)\s' <<< "$runs" | cut -f2- | sort -u || true)
              # A job that ended any other way is never going to pass on this commit, so stop waiting for it.
              failed=$(grep -E '^(failure|cancelled|timed_out|action_required)\s' <<< "$runs" | cut -f2- | sort -u || true)
              waiting=''
              for name in "${REQUIRED[@]}"; do
                if grep -Fxq "$name" <<< "$failed"; then
                  echo "$sha failed \"$name\", so it doesn't deploy."
                  echo "go=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                grep -Fxq "$name" <<< "$passed" || waiting="$waiting $name"
              done
              settled_ui "$settled" || waiting="$waiting the library's jobs"
              [ -z "$waiting" ] && break
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$sha is still waiting on$waiting, so main's own CI run will trigger the deploy."
                echo "go=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Waiting on$waiting"
              sleep 20
            done
            echo "$sha already passed every required job, so it deploys now."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RUN_EVENT" != push ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main's newest commit, not the one whose CI just finished (27 October 2026). This group keeps one run
          # waiting, and a newer one replaces it, so when two pushes land close together the push run for the newer
          # commit can be the one dropped, and the run that survives is CI finishing for the older. Deploying that
          # one's own commit shipped nothing new, or, with its CI cancelled by the newer push, nothing at all. The
          # newest commit is what main is, and it is held to exactly the same jobs below.
          sha=$(gh api "repos/$REPO/commits/main" -q .sha)
          [ "$sha" = "$RUN_SHA" ] || echo "CI finished for $RUN_SHA; main is at $sha, so that is the one asked about."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Not the run's own conclusion. That is red when a single flow shard is, and the flows stopped holding
          # the deploy above; reading the whole run put them back in its way through this door, so a browser that
          # failed to install still stood between a fix and production (27 October 2026). The same jobs decide
          # here as on the push path, read once, since CI has finished by the time this runs.
          runs=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" \
            -q '.check_runs[] | "\(.conclusion)\t\(.name)"' || true)
          passed=$(grep -E '^success\s' <<< "$runs" | cut -f2- | sort -u || true)
          settled=$(grep -E '^(success|skipped)\s' <<< "$runs" | cut -f2- | sort -u || true)
          for name in "${REQUIRED[@]}"; do
            if ! grep -Fxq "$name" <<< "$passed"; then
              echo "$sha hasn't passed \"$name\", so it doesn't deploy."
              echo "go=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          if ! settled_ui "$settled"; then
            echo "$sha hasn't settled the library's jobs, so it doesn't deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # "Already deployed" means a push run whose deploy job really ran, not one whose gate declined and
          # left the run green with the matrix skipped. Reading the run's own conclusion counted the declines
          # too, so after a push the commit could never deploy by either route (25 October 2026).
          done_before=0
          for id in $(gh api --paginate "repos/$REPO/actions/workflows/deploy-web.yml/runs?head_sha=$sha&event=push" -q '.workflow_runs[].id'); do
            shipped=$(gh api "repos/$REPO/actions/runs/$id/jobs" -q '[.jobs[] | select(.name | startswith("deploy")) | select(.conclusion == "success")] | length')
            done_before=$((done_before + shipped))
          done
          if [ "${done_before:-0}" -gt 0 ]; then
            echo "$sha was already deployed by the fast path."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy (${{ matrix.target }})
    needs: gate
    if: needs.gate.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: brij-crm
            org: VERCEL_ORG_ID
            project: VERCEL_PROJECT_ID
            token: VERCEL_TOKEN
            owner: DATABASE_URL_OWNER
            health: https://brij-crm-phi.vercel.app/api/health
            # Beside its Neon database: brij-crm's is in Singapore.
            region: sin1
          - target: timefix
            org: TIMEFIX_VERCEL_ORG_ID
            project: TIMEFIX_VERCEL_PROJECT_ID
            token: TIMEFIX_VERCEL_TOKEN
            owner: TIMEFIX_DATABASE_URL_OWNER
            health: https://app.timefix.com/api/health
            # Beside its Neon database: Timefix's is in us-east-1.
            region: iad1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERCEL_CLI: vercel@54.4.1
      VERCEL_ORG_ID: ${{ vars[matrix.org] }}
      VERCEL_PROJECT_ID: ${{ vars[matrix.project] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read where the api runs
        id: mode
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.token] }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::${{ matrix.token }} isn't set yet, so there's nothing to deploy to."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx -y "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"
          # Whether API_ORIGIN_INTERNAL holds a value, read without printing it.
          if grep -Eq '^API_ORIGIN_INTERNAL="?[^"[:space:]]' .vercel/.env.production.local; then
            echo "The api is proxied (API_ORIGIN_INTERNAL is set)."
            echo "api=proxy" >> "$GITHUB_OUTPUT"
          else
            echo "The api runs as a Vercel Function in this deployment (API_ORIGIN_INTERNAL is unset)."
            echo "api=function" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Wait for the API to run this commit
        if: steps.mode.outputs.deploy == 'true' && steps.mode.outputs.api == 'proxy'
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          HEALTH_URL: ${{ matrix.health }}
        run: |
          set -euo pipefail
          # The api's build filter (render.yaml): a commit that changes none of them doesn't redeploy the API.
          WATCHED=(apps/api packages pnpm-lock.yaml pnpm-workspace.yaml)
          for attempt in $(seq 1 90); do
            release=$(curl -fsS "$HEALTH_URL" | jq -r '.release // empty' || true)
            if [ -n "$release" ] && git cat-file -e "$release^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$SHA" "$release"; then
                echo "The API runs $release, which includes $SHA."; exit 0
              fi
              if git diff --quiet "$release" "$SHA" -- "${WATCHED[@]}"; then
                echo "Nothing the API deploys from changed since $release."; exit 0
              fi
            fi
            echo "The API runs ${release:-an unknown commit}; waiting for $SHA (attempt $attempt)."
            sleep 30
          done
          echo "::error::The API never reached $SHA in 45 minutes, so the web app wasn't deployed."
          exit 1
      - name: Apply migrations (the api runs on Vercel)
        if: steps.mode.outputs.deploy == 'true' && steps.mode.outputs.api == 'function'
        env:
          DATABASE_URL_OWNER: ${{ secrets[matrix.owner] }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL_OWNER" ]; then
            echo "::error::The api runs on Vercel, so this deploy applies the migrations, but the ${{ matrix.owner }} secret isn't set. See docs/runbooks/api-on-vercel.md."
            exit 1
          fi
          node packages/db/scripts/migrate.ts
      - name: Run the functions in this target's region
        if: steps.mode.outputs.deploy == 'true'
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          # apps/web/vercel.json pins brij-crm's region; each target's functions run beside its own database.
          sed -i -E "s/\"regions\": \[[^]]*\]/\"regions\": [\"$REGION\"]/" apps/web/vercel.json
          grep -Fq "\"regions\": [\"$REGION\"]" apps/web/vercel.json
          echo "The functions run in $REGION."
      - name: Build and deploy
        if: steps.mode.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets[matrix.token] }}
          # The source map upload (spec 0010), skipped when the token is absent.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
          HEAD_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          # Under workflow_run, GITHUB_SHA is main's newest commit, not the one CI passed; the release is that one.
          export GITHUB_SHA="$HEAD_SHA"
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN isn't set, so source maps aren't uploaded to Sentry (they're deleted all the same)."
          fi
          vercel() { npx -y "$VERCEL_CLI" "$@" --token "$VERCEL_TOKEN"; }
          vercel build --prod
          # No server secret may reach a file the browser loads (spec 0045); it names the variable, never the value.
          node apps/web/client-secrets.ts .vercel/.env.production.local .vercel/output/static
          vercel deploy --prebuilt --prod

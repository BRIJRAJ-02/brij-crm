# A read-only check of a production database, run by hand when a deploy's migrations and the schema disagree.
# It never writes and never prints a connection string: only the names of things the code expects and the
# database lacks. Added 25 October 2026, after `crm_place_profile_page` turned out to be missing on Timefix
# while the deploy's migrate step reported "Migrations applied." (Drizzle skips, with no error, a migration
# stamped before the newest one a database already applied.)
name: Database doctor

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which production database to read
        required: true
        default: timefix
        type: choice
        options: [timefix, brij-crm, both]

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Read the schema
        env:
          TARGET: ${{ inputs.target }}
          TIMEFIX_URL: ${{ secrets.TIMEFIX_DATABASE_URL_OWNER }}
          BRIJ_URL: ${{ secrets.DATABASE_URL_OWNER }}
        run: |
          set -euo pipefail
          report() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then echo "== $name: no secret set, skipped"; return; fi
            case "$url" in *verify-full*) url="${url}&sslrootcert=system" ;; esac
            echo "== $name"
            psql "$url" -tAc "select 'server: ' || version();"
            psql "$url" -tAc "select 'journal: ' || count(*) || ' applied, newest ' || to_char(to_timestamp(max(created_at)/1000) at time zone 'UTC','YYYY-MM-DD HH24:MI') from drizzle.__drizzle_migrations;"
            echo "-- exact signature resolves?"
            psql "$url" -tAc "select 'regprocedure: ' || 'public.crm_place_profile_page(uuid,uuid,uuid)'::regprocedure::text;" 2>&1 | tail -2
            echo "-- every overload by that name"
            psql "$url" -tAc "select n.nspname || '.' || p.proname || '(' || pg_get_function_arguments(p.oid) || ') owner=' || pg_get_userbyid(p.proowner) || ' cfg=' || coalesce(array_to_string(p.proconfig,','),'none') from pg_proc p join pg_namespace n on n.oid=p.pronamespace where p.proname='crm_place_profile_page';"
            echo "-- deployed body"
            psql "$url" -tAc "select pg_get_functiondef(p.oid) from pg_proc p where p.proname='crm_place_profile_page';"
            echo "-- triggers on auth.profile_items"
            psql "$url" -tAc "select t.tgname || ' -> ' || p.proname from pg_trigger t join pg_proc p on p.oid=t.tgfoid where t.tgrelid='auth.profile_items'::regclass and not t.tgisinternal;"
            echo "-- check constraints on auth.profile_items"
            psql "$url" -tAc "select conname || ': ' || pg_get_constraintdef(oid) from pg_constraint where conrelid='auth.profile_items'::regclass and contype='c';"
            echo "-- where uuidv7 lives"
            psql "$url" -tAc "select n.nspname || '.uuidv7() from ' || coalesce(e.extname,'core') from pg_proc p join pg_namespace n on n.oid=p.pronamespace left join pg_depend d on d.objid=p.oid and d.deptype='e' left join pg_extension e on e.oid=d.refobjid where p.proname='uuidv7' and p.pronargs=0;"
            echo "-- can crm_app execute it?"
            psql "$url" -tAc "select 'crm_app execute: ' || has_function_privilege('crm_app','public.crm_place_profile_page(uuid,uuid,uuid)','execute')::text;" 2>&1 | tail -2
          }
          case "$TARGET" in
            timefix)  report timefix "$TIMEFIX_URL" ;;
            brij-crm) report brij-crm "$BRIJ_URL" ;;
            both)     report timefix "$TIMEFIX_URL"; echo; report brij-crm "$BRIJ_URL" ;;
          esac

# The scheduled job run (spec 0045). While the api runs as a Vercel Function there is no worker process, so every
# 10 minutes this asks production's api to run its job queue for a bounded turn: scheduled calendar syncs, booking
# emails that a request's own turn didn't finish, retries, and the daily cleanup after 03:00 UTC. A request that
# queues work already starts a turn of its own after it answers; this is the floor under that, so a queued job
# waits at most about 10 minutes when nobody uses the app. GitHub may start a scheduled run late, or skip one when
# it is busy. Behind a proxied API (Railway or Render, API_ORIGIN_INTERNAL set), the worker runs the jobs and that
# API has no such endpoint (it answers NOT_FOUND, or FORBIDDEN_ORIGIN to a write with no Origin), which this treats
# as nothing to do.
#
# Secret: JOBS_RUN_SECRET, the same value as the Vercel project's Production JOBS_RUN_SECRET. Unset, this does nothing.
name: Jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: jobs-run
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the job queue for one turn
        env:
          JOBS_RUN_SECRET: ${{ secrets.JOBS_RUN_SECRET }}
          JOBS_URL: https://brij-crm-phi.vercel.app/api/internal/jobs/run
        run: |
          set -euo pipefail
          if [ -z "$JOBS_RUN_SECRET" ]; then
            echo "::notice::JOBS_RUN_SECRET isn't set, so there is no job run to call."
            exit 0
          fi
          # The secret goes in a header read from stdin, never on the command line or in the log.
          status=$(printf 'x-crm-jobs-secret: %s\n' "$JOBS_RUN_SECRET" | curl -sS -o body.json -w '%{http_code}' \
            --max-time 120 -X POST -H @- "$JOBS_URL")
          code=$(jq -r '.code // empty' body.json 2>/dev/null || true)
          if [ "$status" = 200 ]; then
            echo "Job run: $(jq -c '{outcome, ms}' body.json)"
          elif [ "$code" = NOT_FOUND ] || [ "$code" = FORBIDDEN_ORIGIN ]; then
            echo "::notice::No job endpoint here: the api runs behind a proxy, where the worker runs the jobs."
          else
            echo "::error::The job run answered $status ${code:-with no code}."
            exit 1
          fi

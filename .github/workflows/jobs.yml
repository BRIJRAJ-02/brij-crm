# The scheduled job run (spec 0045). While the api runs as a Vercel Function there is no worker process, so once
# an hour (at minute 7, off GitHub's busy top of the hour) this asks production's api to run its job queue for a bounded turn: scheduled calendar syncs, booking
# emails that a request's own turn didn't finish, retries, the hour's digest, and the daily cleanup after 03:00 UTC. A request that
# queues work already starts a turn of its own after it answers; this is the floor under that, so a queued job
# waits at most about an hour when nobody uses the app (hourly, not more often, so Neon's free compute can sleep). GitHub may start a scheduled run late, or skip one when
# it is busy. Behind a proxied API (Railway or Render, API_ORIGIN_INTERNAL set), the worker runs the jobs and that
# API has no such endpoint (it answers NOT_FOUND, or FORBIDDEN_ORIGIN to a write with no Origin), which this treats
# as nothing to do.
#
# Each production gets its own run: brij-crm (JOBS_RUN_SECRET) and Timefix at app.timefix.com (TIMEFIX_JOBS_RUN_SECRET),
# each the same value as that Vercel project's Production JOBS_RUN_SECRET. A target whose secret is unset does nothing.
# Timefix, on Vercel Pro, also runs the same turn every 15 minutes from Vercel Cron (GET with CRON_SECRET, a crons entry
# its deploy patches in; spec 0045), so this run is a second floor there; brij-crm, on Hobby, has only this one.
name: Jobs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: jobs-run
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    name: run (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: brij-crm
            secret: JOBS_RUN_SECRET
            url: https://brij-crm-phi.vercel.app/api/internal/jobs/run
          - target: timefix
            secret: TIMEFIX_JOBS_RUN_SECRET
            url: https://app.timefix.com/api/internal/jobs/run
    steps:
      - name: Run the job queue for one turn
        env:
          JOBS_RUN_SECRET: ${{ secrets[matrix.secret] }}
          JOBS_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          if [ -z "$JOBS_RUN_SECRET" ]; then
            echo "::notice::${{ matrix.secret }} isn't set, so there is no job run to call."
            exit 0
          fi
          # The secret goes in a header read from stdin, never on the command line or in the log. A turn that ends on
          # its budget left work due (a long import, a backlog of reminders), so the run calls again, up to 4 turns.
          for turn in 1 2 3 4; do
            status=$(printf 'x-crm-jobs-secret: %s\n' "$JOBS_RUN_SECRET" | curl -sS -o body.json -w '%{http_code}' \
              --max-time 120 -X POST -H @- "$JOBS_URL")
            code=$(jq -r '.code // empty' body.json 2>/dev/null || true)
            if [ "$status" = 200 ]; then
              echo "Job run $turn: $(jq -c '{outcome, ms}' body.json)"
              [ "$(jq -r '.outcome' body.json)" = budget ] || break
            elif [ "$code" = NOT_FOUND ] || [ "$code" = FORBIDDEN_ORIGIN ]; then
              echo "::notice::No job endpoint here: the api runs behind a proxy, where the worker runs the jobs."
              break
            else
              echo "::error::The job run answered $status ${code:-with no code}."
              exit 1
            fi
          done

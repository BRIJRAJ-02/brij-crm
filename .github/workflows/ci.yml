# The check every push must pass: typecheck, lint, format, CSS, module edges,
# house rules and tests, the first load budget and the artifact build; the
# core loop's flows in the browser; the library's stories in each engine; and
# its screenshots. Make `check`, `flows (1/4)` to `flows (4/4)`, `stories (chromium)`,
# `stories (firefox)`, `stories (webkit)` and `visual` required status checks
# on `main` (branch protection), so a red build blocks the merge.
name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung browser once held a job for over 40 minutes; a normal run takes under 10 (every step runs since round 9).
    timeout-minutes: 35
    permissions:
      contents: read
    # A real Postgres for the integration tests (never a mocked one), the same
    # major version and port as the local stack, so the test default URL fits.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Catches the sign in code emails the api's tests read back (spec 0005).
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 8025:8025
      # Centrifugo for the realtime tests (spec 0005): the image infra/centrifugo/Dockerfile pins, on the
      # local stack's ports and keys. A service can't take the repo's config file, so the workspace
      # namespace comes in as JSON; a test in apps/api keeps it equal to infra/centrifugo/config.json.
      centrifugo:
        image: centrifugo/centrifugo:v6.9.7
        env:
          CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT: "9000"
          CENTRIFUGO_HEALTH_ENABLED: "true"
          CENTRIFUGO_HTTP_API_KEY: local-centrifugo-api-key
          CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: local-centrifugo-token-secret
          CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"workspace","allow_subscribe_for_client":false,"history_size":1000,"history_ttl":"300s","force_recovery":true}]'
        ports:
          - 8000:8000
          - 9000:9000
        options: >-
          --health-cmd "wget -q -O - http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      # Every step below runs even when one before it failed, so one push shows every red check at once.
      - run: pnpm check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # A migration stamped before one already deployed is skipped for good (packages/db/scripts/journal.ts), so
      # every push checks its journal against the commit it replaced.
      - name: Migrations stay in deploy order
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE" || true
          node packages/db/scripts/journal.ts "$BEFORE"
      - name: Read the Playwright version
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: playwright
        run: echo "version=$(node -p "require('./packages/ui/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # The runner's apt mirror once stalled this step for 17 minutes and the job ran out of time (run 39768197543):
      # apt gives up on a slow mirror after 20 seconds and tries the next, and a stalled try starts again once.
      - name: Install the browsers and their system packages
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          for attempt in 1 2; do
            if timeout 5m pnpm --filter @crm/ui exec playwright install --with-deps chromium; then break; fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo "The browser install stalled or failed; trying once more"
            # timeout stops playwright, not the apt-get it started under sudo, which then holds the dpkg lock and
            # fails the retry (run 39798426646): let a slow one finish for up to 4 minutes, then stop it.
            timeout 4m bash -c 'while pgrep -x apt-get > /dev/null; do sleep 5; done' || sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # Every package's tests; the library's stories run in their own jobs below.
      # The library runs after the rest, on its own: its scroll perf test counts
      # long tasks, and the database suites beside it on a small runner make them.
      - run: pnpm exec turbo run test --continue --filter='!@crm/ui' --filter='!@crm/core'
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      # The engine's suite alone, after the rest: its 70,000 and 200,000 link tests are heavy for a small
      # runner. Its count cancel test locks the records table, so query.test.ts has a database of its own
      # (test/global-setup.ts): in the shared one the lock stalled every file (main, 13 October 2026).
      - run: pnpm --filter @crm/core run test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm --filter @crm/ui exec vitest run --project stories --project unit --project browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CRM_STORY_BROWSERS: none
      # The scroll perf test alone, last: vitest runs projects side by side, and the browser suites
      # beside it made long tasks of their own on the 2 core runner (3 of 4 runs on 8 October 2026).
      - run: pnpm --filter @crm/ui exec vitest run --project perf
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: pnpm ui:artifact --check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

  # The core loop's flows (spec 0005, milestone 4): the built app, the api and
  # the worker on the local ports against their own services, driven by
  # Playwright: sign in, People, session, keyboard, live, the record page,
  # options (spec 0012, milestone 3), validation rules (spec 0013,
  # milestone 1), delete, undo and the trash (spec 0022, milestone 1), and a
  # Google sign in that succeeds (F34), against the fake Google the api loads
  # here (apps/api/test/fake-google.ts; the browser half is in the flow).
  # Then My tasks, notes, the record's timeline, moving between pages (layout
  # shift), a form's first publish and attributes without setup. They run in
  # Chromium (1280 and 375 wide); the live flow's reader opens in WebKit, so a
  # change crosses two browser engines. The longer ones (catch up, settle,
  # versions, scale, hidden, timeline scale, fonts) stay for the final
  # thorough run, and so does loading shape (Calendars' skeleton draws a card
  # where a member with no calendars gets an empty state). Nothing here
  # touches a deployed environment.
  flows:
    name: flows (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Four shards, each with its own stack: one job ran past 40 minutes once round 9 had every flow (run 39706435009).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 8025:8025
      centrifugo:
        image: centrifugo/centrifugo:v6.9.7
        env:
          CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT: "9000"
          CENTRIFUGO_HEALTH_ENABLED: "true"
          CENTRIFUGO_HTTP_API_KEY: local-centrifugo-api-key
          CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: local-centrifugo-token-secret
          CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: http://localhost:5173
          CENTRIFUGO_CHANNEL_NAMESPACES: '[{"name":"workspace","allow_subscribe_for_client":false,"history_size":1000,"history_ttl":"300s","force_recovery":true}]'
        ports:
          - 8000:8000
          - 9000:9000
        options: >-
          --health-cmd "wget -q -O - http://localhost:9000/health"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    # The local stack's values (.env.example), with the app's queries direct to Postgres (no PgBouncer here).
    env:
      APP_ENV: local
      PORT: "3000"
      WORKER_PORT: "3001"
      APP_URL: http://localhost:5173
      DATABASE_URL: postgres://crm_app_user:crm_app_local@localhost:5433/crm
      DATABASE_URL_DIRECT: postgres://crm_worker_user:crm_worker_local@localhost:5433/crm
      DATABASE_URL_OWNER: postgres://crm_owner:crm_owner_local@localhost:5433/crm
      IDENTITY_DATABASE_URL: postgres://crm_identity_user:crm_identity_local@localhost:5433/crm
      BETTER_AUTH_SECRET: local-only-better-auth-secret-not-for-deployment
      BETTER_AUTH_URL: http://localhost:5173
      MAILPIT_URL: http://localhost:8025
      CENTRIFUGO_API_URL: http://localhost:9000
      CENTRIFUGO_API_KEY: local-centrifugo-api-key
      CENTRIFUGO_TOKEN_SECRET: local-centrifugo-token-secret
      WORKER_INTERNAL_URL: http://localhost:3001
      WORKER_WAKE_SECRET: local-only-worker-wake-secret-not-for-deployment
      VITE_REALTIME_URL: ws://localhost:8000/connection/websocket
      FLOW_READER_BROWSER: webkit
      # Turns Google sign in on for the flows; a fake client, as the fake Google answers the code exchange.
      GOOGLE_CLIENT_ID: flow-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: flow-only-google-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The owner role and the database, as the local stack's init script makes them, then the migrations and logins.
      - run: psql -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
          PGPASSWORD: postgres
      # Migrate as production does: first up to main's journal, then the new migrations in a session of their own,
      # as the owner (never a superuser). One fresh session for every migration hides one that only works because
      # an earlier one loaded something, like 0058's pg_trgm setting (22 October 2026).
      - name: Migrate to main first, then the rest
        run: |
          journal=packages/db/migrations/meta/_journal.json
          if git fetch --no-tags --depth=1 origin main; then
            git show FETCH_HEAD:"$journal" > "$RUNNER_TEMP/journal.json"
            cp "$RUNNER_TEMP/journal.json" "$journal"
            pnpm db:migrate
            git checkout -- "$journal"
          fi
      - run: pnpm db:setup
      - run: pnpm exec turbo run build --filter=@crm/web
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      # The runner's apt mirror once stalled this step for 17 minutes and the job ran out of time (run 39768197543):
      # apt gives up on a slow mirror after 20 seconds and tries the next, and a stalled try starts again once.
      - name: Install the browsers and their system packages
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          for attempt in 1 2; do
            if timeout 5m pnpm --filter @crm/web exec playwright install --with-deps chromium webkit; then break; fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo "The browser install stalled or failed; trying once more"
            # timeout stops playwright, not the apt-get it started under sudo, which then holds the dpkg lock and
            # fails the retry (run 39798426646): let a slow one finish for up to 4 minutes, then stop it.
            timeout 4m bash -c 'while pgrep -x apt-get > /dev/null; do sleep 5; done' || sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
      - name: Start the api, the worker and the built app
        run: |
          mkdir -p logs
          (cd apps/api && nohup node --import ./src/monitoring/instrument.ts --import ./test/fake-google.ts src/server.ts > ../../logs/api.log 2>&1 &)
          (cd apps/api && nohup node --import ./src/monitoring/instrument.ts src/worker.ts > ../../logs/worker.log 2>&1 &)
          (cd apps/web && nohup pnpm exec vite preview --port 5173 --strictPort > ../../logs/web.log 2>&1 &)
          for url in http://localhost:5173/api/health/ready http://localhost:3001/health; do
            for attempt in $(seq 1 60); do
              if curl -fsS "$url" > /dev/null; then break; fi
              if [ "$attempt" = 60 ]; then echo "$url never answered"; cat logs/*.log; exit 1; fi
              sleep 1
            done
          done
      # One flow per line, so a lane adds its own flow without touching anyone else's line.
      - name: Run the flows
        # The import flow runs 1,000 rows here, to keep the job inside its time; spec 0040's 5,000 row run and its
        # timing are the scale check's (FLOW_IMPORT_ROWS unset).
        env:
          FLOW_IMPORT_ROWS: "1000"
        run: >-
          pnpm --filter @crm/web test:flow --shard=${{ matrix.shard }}/4
          e2e/sign-in.flow.ts
          e2e/people.flow.ts
          e2e/session.flow.ts
          e2e/keyboard.flow.ts
          e2e/live.flow.ts
          e2e/record.flow.ts
          e2e/options.flow.ts
          e2e/rules.flow.ts
          e2e/relations.flow.ts
          e2e/links.flow.ts
          e2e/views.flow.ts
          e2e/views-manage.flow.ts
          e2e/trash.flow.ts
          e2e/bulk.flow.ts
          e2e/tasks.flow.ts
          e2e/notes.flow.ts
          e2e/google.flow.ts
          e2e/my-tasks.flow.ts
          e2e/timeline.flow.ts
          e2e/switching.flow.ts
          e2e/forms-publish.flow.ts
          e2e/members.flow.ts
          e2e/schedules.flow.ts
          e2e/command.flow.ts
          e2e/attributes.flow.ts
          e2e/forms-confirms.flow.ts
          e2e/form-to-booking.flow.ts
          e2e/embed.flow.ts
          e2e/sidebar.flow.ts
          e2e/comments.flow.ts
          e2e/frame.flow.ts
          e2e/preferences.flow.ts
          e2e/loading-shape.flow.ts
          e2e/booking-chat.flow.ts
          e2e/import.flow.ts
          e2e/csp.flow.ts
          e2e/two-factor.flow.ts
          e2e/owner.flow.ts
      - name: Keep the traces and the logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: flow-results-${{ matrix.shard }}
          path: |
            apps/web/test-results/
            logs/
          if-no-files-found: ignore

  # The library's stories as tests, one engine per job so they run side by
  # side (spec 0003, AC-15). With milestone 2 one engine took about 5 minutes;
  # add `--shard` to a job once it passes 10.
  stories:
    name: stories (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # A hung browser once held a job for over 40 minutes; a normal run takes under 10 (every step runs since round 9).
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/ui/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      # The runner's apt mirror once stalled this step for 17 minutes and the job ran out of time (run 39768197543):
      # apt gives up on a slow mirror after 20 seconds and tries the next, and a stalled try starts again once.
      - name: Install the browsers and their system packages
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
          for attempt in 1 2; do
            if timeout 5m pnpm --filter @crm/ui exec playwright install --with-deps ${{ matrix.browser }}; then break; fi
            if [ "$attempt" = 2 ]; then exit 1; fi
            echo "The browser install stalled or failed; trying once more"
            # timeout stops playwright, not the apt-get it started under sudo, which then holds the dpkg lock and
            # fails the retry (run 39798426646): let a slow one finish for up to 4 minutes, then stop it.
            timeout 4m bash -c 'while pgrep -x apt-get > /dev/null; do sleep 5; done' || sudo pkill -x apt-get || true
            sudo dpkg --configure -a || true
          done
      - run: pnpm --filter @crm/ui exec vitest run --project "stories (${{ matrix.browser }})"
        env:
          CRM_STORY_BROWSERS: ${{ matrix.browser }}

  # Screenshots of every story, light and dark, against the committed
  # baselines. They run in the pinned Playwright image, the same one
  # `pnpm test:visual` uses locally, so fonts and rendering match exactly.
  visual:
    runs-on: ubuntu-latest
    # A hung browser once held a job for over 40 minutes; a normal run takes under 10 (every step runs since round 9).
    timeout-minutes: 35
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CRM_VISUAL_IMAGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: visual
        run: pnpm test:visual
      - name: Keep the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: packages/ui/.vitest/attachments/
          if-no-files-found: ignore
      # When the screenshots differ, the new baselines are rendered here in the
      # same image, so nobody runs the image on a laptop. Download this
      # artifact, copy it over packages/ui/__screenshots__, and commit only the
      # stories the change meant to move.
      - name: Render the new baselines
        if: failure() && steps.visual.outcome == 'failure'
        run: pnpm test:visual --update
      - name: Keep the new baselines
        if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-baselines
          path: packages/ui/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

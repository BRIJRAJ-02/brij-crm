<!doctype html>
<!-- The ground this page stands on, painted with the stylesheet rather than when the script runs. -->
<html lang="en" data-public-page="form">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Hosted forms stay out of search engines (spec 0023, AC-587). -->
    <meta name="robots" content="noindex" />
    <!-- A phone's browser bar in the page's colour: the surface token, light and dark. -->
    <meta name="theme-color" content="#fdfdff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18191c" media="(prefers-color-scheme: dark)" />
    <title>Timefix</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/brand/timefix-mark.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- The form's own look (Colour) decides light or dark, never the visitor's saved app theme. -->
    <div id="root" data-app-root></div>
    <script type="module" src="/src/public/main.ts"></script>
  </body>
</html>

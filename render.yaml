# Render Blueprint for the CRM's backend on Render's free plan, for the test phase (spec 0044), replacing
# .railway/railway.ts. Apply it once from the Render dashboard (New, Blueprint, this repo); the steps are in
# docs/runbooks/render-cutover.md.
#
# One free web service runs everything: apps/api/src/launch.ts migrates, then starts the api and the worker as two
# processes in the one container (the free plan has no pre deploy step and no private services). Live updates are
# off: there is no Centrifugo. The paid layout (three Starter services with Centrifugo) is the upgrade path in
# spec 0044.
#
# Secrets are never committed. `sync: false` makes Render ask for the value when the Blueprint is first applied,
# and later syncs leave it alone. `generateValue: true` makes Render create a random 256 bit value once; the api
# and the worker share it, since both run in this one service.
#
# Region: Singapore, beside the Neon database (aws ap-southeast-1). Deploys: from `main`, only after its CI checks
# pass, and only when a file the image builds from changed.

services:
  - type: web
    name: brij-crm-api
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    # Migrations, then the api and the worker, each with Sentry's instrument and its own heap cap.
    dockerCommand: node apps/api/src/launch.ts
    # The liveness check, which never queries: Render checks every few seconds, and a query each time would keep
    # Neon's compute awake around the clock. A database that is down still fails the boot (migrations, the role
    # check), so a broken deploy never goes live.
    healthCheckPath: /api/health
    # SIGTERM to SIGKILL: the worker's slices finish their batch and hand their jobs back.
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      # The api's port, which Render routes public traffic to. The worker's port stays inside the container.
      - key: PORT
        value: "8080"
      - key: WORKER_PORT
        value: "8081"
      - key: WORKER_INTERNAL_URL
        value: http://127.0.0.1:8081
      - key: APP_ENV
        value: production
      # No Centrifugo on the free plan: the worker runs with the relay off.
      - key: LIVE_UPDATES
        value: "off"
      # Graphile's cron is UTC whatever the zone; the logs' times and anything else local read UTC too.
      - key: TZ
        value: UTC
      # https://brij-crm-phi.vercel.app (the web app's origin; the api is only reached through it).
      - key: APP_URL
        sync: false
      # Extra origins allowed to write (comma separated), if any.
      - key: TRUSTED_ORIGINS
        sync: false
      # The edge guard's shared secret (spec 0005). Copy this generated value into Vercel's EDGE_SECRET.
      - key: EDGE_SECRET
        generateValue: true
      # Neon: the app login (pooler host), the owner (direct host, migrations only), the identity login (pooler
      # host) and the worker login (direct host, for Graphile's LISTEN).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_OWNER
        sync: false
      - key: IDENTITY_DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      # Sign in (spec 0005): Better Auth, the allowlist and mail.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: SIGNUP_ALLOWLIST
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The api's wake call to the worker (spec 0005), and guest page links in booking emails (spec 0025).
      - key: WORKER_WAKE_SECRET
        generateValue: true
      - key: BOOKING_LINK_SECRET
        generateValue: true
      # Spec 0008: `on` lets signed in requests wake the worker once a minute. Off in production until set.
      - key: WORKER_WAKE_ON_USE
        sync: false
      # Background jobs (spec 0008): `on` to run them (off in production when unset), and the idle seconds before
      # the worker sleeps (180 when unset, 0 never).
      - key: JOBS_RUNNER
        sync: false
      - key: WORKER_IDLE_SLEEP_SECONDS
        sync: false
      # Monitoring (spec 0010): the brij-crm-server DSN. Unset means off. The release is RENDER_GIT_COMMIT.
      - key: SENTRY_DSN_SERVER
        sync: false
      # `on` opens system.testFault to prove an error report; leave it empty otherwise.
      - key: MONITORING_TEST_FAULT
        sync: false
      # Product events (spec 0010): the PostHog EU project's key. POSTHOG_HOST defaults to the EU ingest.
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      # Forms (spec 0023): reCAPTCHA v3 (both or neither), the salt client addresses are hashed with, and the
      # origin form pages are served from when it differs from APP_URL.
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: FORMS_IP_SALT
        generateValue: true
      - key: FORMS_PUBLIC_ORIGIN
        sync: false
      # Calendar sync (spec 0024): off until CALENDAR_SYNC=on with the Google client, the token key and the public
      # origin Google posts push notices to. CALENDAR_TOKEN_KEY seals stored tokens: keep production's value.
      - key: CALENDAR_SYNC
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: CALENDAR_TOKEN_KEY
        sync: false
      - key: CALENDAR_WEBHOOK_ORIGIN
        sync: false

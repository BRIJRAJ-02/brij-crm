# The load stack's Postgres (spec 0011, AC-193), read in place of the image's
# own postgresql.conf, so it names the settings the image would otherwise set.
# Sized for a container capped at 2 vCPU and 8 GB, like a small Neon compute.

# The image's own defaults that a replaced config file would lose.
listen_addresses = '*'
max_connections = 200
dynamic_shared_memory_type = posix
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Memory, for the 8 GB cap.
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB

# What the harness reads: the statements with the most time, and time spent on I/O.
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
